name: Dev Build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and package (without images)
        run: |
          chmod +x build.sh
          ./build.sh --dir dist/dev-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jrlp-dev-build-${{ env.SHORT_SHA }}
          path: dist/dev-build/
          retention-days: 7
